<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Us</title>
<!-- v11 -->
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Us">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf4f2; --card:#fffbfa; --ink:#2a2124; --soft:#8a777b; --faint:#c3b1b4; --line:#f1e1e1;
  --accent:#d0607a; --accent-soft:#fbe6ea; --sage:#e4ebe3; --sage-ink:#3f6b4c;
  --night:#1f2140; --night2:#3a2e55; --sand:#fde7dc; --mist:#e8ecfa;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 60px);max-width:520px;margin:0 auto;background-image:radial-gradient(circle at 15% 0%,#fde3e8 0,transparent 40%),radial-gradient(circle at 100% 10%,#efe6fb 0,transparent 35%);background-repeat:no-repeat}
.hand{font-family:Caveat,cursive}
h1,h2,h3{margin:0;font-weight:500}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600}
.card > .label::before{content:"♡ ";color:var(--accent);letter-spacing:0}
.muted{color:var(--soft);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0;border:1px solid var(--line);box-shadow:0 4px 18px rgba(208,96,122,.06)}
.card > .label{display:block;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* header */
.top{text-align:center;padding:4px 0 6px}
.heart{font-size:44px;color:var(--accent);line-height:1;text-shadow:0 6px 20px rgba(208,96,122,.35)}
.tag{font-family:Caveat,cursive;font-size:22px;color:var(--accent);margin-top:2px}
.heart span{display:inline-block;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.07)}48%{transform:scale(1)}}
.sub{margin-top:6px;font-size:14px;color:var(--soft)}
.sub b{color:var(--ink);font-weight:600}
.days{display:flex;justify-content:center;gap:5px;margin:10px auto 0}
.days i{font-style:normal;font-size:15px;color:var(--line);transition:.3s}
.days i.on{color:var(--accent);opacity:.5}
.days i.today{opacity:1;transform:scale(1.35)}

/* split */
.split{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r);overflow:hidden;margin:14px 0 8px;min-height:250px;position:relative;box-shadow:0 8px 28px rgba(208,96,122,.13)}
.split .mid{position:absolute;left:50%;top:12px;margin-left:-17px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 12px rgba(0,0,0,.15);z-index:2;animation:beat 2.4s ease-in-out infinite}
.half{padding:16px;min-width:0;transition:background .6s,color .6s;background:var(--sand)}
.half.day.warm{background:linear-gradient(180deg,#fff0e4,#fbdde0)}
.half.day.cold{background:linear-gradient(180deg,#eaf0fd,#ece3f8)}
.half.night{background:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 15%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 10% 65%,#fff 50%,transparent 51%),linear-gradient(180deg,var(--night),var(--night2));color:#efe9f7}
.half.night .label,.half.night .sm{color:#a9a6bf}
.half .place{font-size:16px;font-weight:600;margin-top:4px;line-height:1.2;overflow-wrap:anywhere}
.half .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;margin-top:3px;opacity:.85}
.half .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#4caf7a;box-shadow:0 0 0 3px rgba(76,175,122,.2)}
.half .clock{font-family:"Instrument Serif",Georgia,serif;font-size:40px;line-height:1;margin-top:12px}
.half .sm{font-size:12px;color:var(--soft)}
.half .wxrow{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.half .temp{font-family:"Instrument Serif",Georgia,serif;font-size:44px;line-height:1}
.half .ico{font-size:22px}
.half .meta{font-size:12px;margin-top:10px;line-height:1.6;opacity:.85}
.half .status{display:inline-block;margin-top:10px;font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--ink)}
.half.night .status{background:rgba(255,255,255,.12);color:#ece8f4}
.between{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin:2px 0 4px}
.between b{color:var(--ink);font-weight:600}

/* journey */
.arc{width:100%;height:100px;display:block;margin:8px 0}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width 1s}
.big{font-family:"Instrument Serif",Georgia,serif;font-size:30px;line-height:1.1;margin-top:4px}

/* buttons */
.btn{background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--sage-ink)}
.switch.on::after{left:21px}

/* places */
.places{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.places::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;text-align:left}
.chip.sel{border-color:var(--ink)}
.chip .d{font-size:11px;color:var(--soft);display:block}
.chip .here{font-size:10px;color:var(--sage-ink);background:var(--sage);border-radius:99px;padding:1px 6px;margin-left:6px}

/* aurora */
.aurora{background:linear-gradient(160deg,#131726,#1e2a40 60%,#1c4440);color:#e6f2ee;border:0}
.aurora .label{color:#9fb8b0}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#57d6a4,#7bb8ff,#b38cff)}

/* notes */
.note-btn{width:100%;text-align:left;background:linear-gradient(135deg,#fdeef0,#fbe2e8);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px dashed #efbcc8}
.letter{font-family:Caveat,cursive;font-size:30px;line-height:1.25;white-space:pre-wrap;color:#4a2a33}
.past{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:10px}
.past button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:11px;color:var(--soft)}
.past button.read{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.past button.locked{opacity:.35}

/* heart + moods */
.send{display:flex;align-items:center;gap:12px}
.hbtn{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;flex:0 0 auto;transition:transform .15s}
.hbtn:active{transform:scale(.9)}
.moods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.moods button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:18px;flex:0 0 auto}
.feedlist{margin-top:14px;border-top:1px solid var(--line)}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border:0}
.ev .who{font-weight:600}
.ev .t{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
.floaty{position:fixed;pointer-events:none;font-size:20px;color:var(--accent);animation:up 1.6s ease-out forwards;z-index:50}
@keyframes up{to{transform:translateY(-120px);opacity:0}}

/* postcards */
.feed{display:grid;gap:14px}
.pc img{width:100%;border-radius:12px;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.pc{background:#fff;padding:10px 10px 8px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.pc img{border-radius:3px !important}
.pc .cap{font-family:Caveat,cursive;font-size:24px;margin-top:6px}
.pc .by{font-size:12px;color:var(--soft)}
.upload{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.upload input[type=text]{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;min-width:0}

/* legs */
.leg{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.leg:last-child{border:0}
.leg .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--faint);margin-top:5px;flex:0 0 auto}
.leg.done .dot{background:var(--sage-ink);border-color:var(--sage-ink)}
.leg.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ok{display:inline-block;margin-top:6px;font-size:12px;background:var(--sage);color:var(--sage-ink);border-radius:99px;padding:2px 9px}

/* sheet & toast */
.sheet{position:fixed;inset:0;background:rgba(42,33,36,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:40;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px)}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:340px;border-radius:24px;padding:24px 20px;max-height:82vh;overflow:auto;box-shadow:0 20px 50px rgba(42,33,36,.25);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sheet input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin-top:8px;background:#fff}
.sheet .who2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sheet .who2 .btn{padding:12px 8px}
.sheet .center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.foot{text-align:center;font-size:12px;color:var(--soft);margin:22px 0}
.foot button{background:none;color:var(--soft);font-size:12px;text-decoration:underline}
#hMe{padding-right:24px}#hHer{padding-left:24px}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);transform:translate(-50%,-60px);width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(42,33,36,.15);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:18px;z-index:45;transition:transform .2s,opacity .2s;opacity:0}
.ptr.spin span{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 10px);width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--soft);font-size:16px;display:flex;align-items:center;justify-content:center}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px}
.pager .btn:disabled{opacity:.35}
.banner{display:flex;align-items:center;gap:10px;background:var(--sage);color:var(--sage-ink);border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:500;animation:pop .25s ease-out}
.banner .x{margin-left:auto;background:none;color:inherit;opacity:.6;font-size:18px;padding:0 4px}
.banner.warn{background:#fdf0dc;color:#8a5a12;flex-wrap:wrap}
.banner .go{background:#8a5a12;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.feed.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;margin:0 -4px}
.feed.strip::-webkit-scrollbar{display:none}
.feed.strip .pc{flex:0 0 84%;scroll-snap-align:center}
.pcount{text-align:center;font-size:12px;color:var(--soft);margin-top:8px}
.pcfull img{width:100%;border-radius:12px;display:block}
.plan{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border:0}
.plan .when{flex:0 0 74px;font-size:12px;color:var(--soft);line-height:1.35}
.plan .when b{display:block;color:var(--ink);font-size:13px}
.plan .what{flex:1;min-width:0}
.plan .free{display:inline-block;margin-top:4px;font-size:11px;background:var(--sage);color:var(--sage-ink);border-radius:99px;padding:2px 8px}
.plan.now .when b{color:var(--accent)}
</style>
</head>
<body>

<div class="ptr" id="ptr"><span>↻</span></div>
<button class="refresh" id="refreshBtn" aria-label="Refresh">↻</button>
<header class="top">
  <div class="heart serif"><span>♥</span></div>
  <div class="tag">same sky, different time zones</div>
  <div class="sub" id="sub"></div>
  <div class="days" id="days"></div>
</header>

<div id="banner"></div>
<div id="locBanner"></div>
<section id="journey"></section>

<div class="split">
  <div class="half" id="hMe"></div>
  <div class="mid">♥</div>
  <div class="half" id="hHer"></div>
</div>
<div class="between" id="between"></div>

<section class="card" id="locCard">
  <div class="toggle">
    <div><div style="font-weight:500">Share my location</div><div class="muted" id="locStatus">Off. Your side shows the planned location.</div></div>
    <button class="switch" id="locSwitch" aria-label="Share my location"></button>
  </div>
</section>

<section class="card">
  <span class="label">Places</span>
  <div class="places" id="chips"></div>
  <div id="stopInfo"></div>
</section>

<section class="card" id="plansBox" hidden>
  <span class="label">Coming up</span>
  <div id="plans"></div>
</section>

<section id="auroraBox"></section>

<section class="card">
  <span class="label">Best time to call</span>
  <div id="callWin"></div>
</section>

<section class="card">
  <span class="label">Note for today</span>
  <div id="noteBox"></div>
  <div class="past" id="past"></div>
</section>

<section class="card" id="loveCard">
  <span class="label">Thinking of you</span>
  <div class="send">
    <button class="hbtn" id="heartBtn" aria-label="Send a heart">♥</button>
    <div class="moods" id="moods"></div>
  </div>
  <div class="feedlist" id="activity"></div>
</section>

<section class="card" id="pcCard">
  <span class="label">Postcards</span>
  <div class="upload">
    <input type="text" id="cap" placeholder="Add a caption" maxlength="120">
    <label class="btn small" for="file">Add photo</label>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="feed" id="feed"></div>
  <div class="pcount" id="pcount"></div>
</section>

<section class="card">
  <span class="label">Journey</span>
  <div id="legs"></div>
</section>

<section class="card" id="installCard" hidden>
  <span class="label">Install</span>
  <div class="muted">In Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>
</section>

<div class="foot"><span id="mode"></span> · <button id="whoBtn">change</button></div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
